apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: {{ .Values.backend.kafkaBootstrap | quote }} }
            - { name: DB_URL, value: {{ .Values.backend.dbUrl | quote }} }
            - { name: SAP_BASE_URL, value: {{ .Values.backend.sapBaseUrl | quote }} }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.dbSecret }}, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.dbSecret }}, key: password } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 8080 }]
