services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment: { POSTGRES_DB: inventory, POSTGRES_USER: inventory, POSTGRES_PASSWORD: inventory }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U inventory"], interval: 5s, retries: 10 }

  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on: { kafka: { condition: service_started }, postgres: { condition: service_healthy } }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/inventory

  forecaster:
    build: ./forecaster
    depends_on: [backend]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_DSN: postgresql://inventory:inventory@postgres:5432/inventory
      INTERVAL_SECONDS: "300"

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
